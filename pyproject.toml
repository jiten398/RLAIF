[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "panelforge"
version = "0.1.0"
description = "Multi-agent RLAIF orchestration and DPO fine-tuning for indie LLM developers."
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.34"]
openai-compatible = ["httpx>=0.27"]
train = ["torch>=2.2", "transformers>=4.42", "trl>=0.9", "peft>=0.11", "datasets>=2.19", "accelerate>=0.30", "bitsandbytes>=0.43"]

[project.scripts]
panelforge = "panelforge.cli:main"

[tool.setuptools.packages.find]
include = ["panelforge*"]
